name: job-bot

on:
  schedule:
    - cron: "5 6-20/2 * * 1-5"   # lunes a viernes, cada 2 h de 7:05 a 21:05 (hora de París en invierno)
  workflow_dispatch:              # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write                 # para guardar seen.json en el repo

concurrency:
  group: job-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python job_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Guardar ofertas vistas
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen.json jobs.csv 2>/dev/null || git add seen.json
          git diff --cached --quiet || git commit -m "Actualiza ofertas vistas"
          git push
